aboutUs_title = \u0938\u092E\u092F \u0915\u0932\u0947\u0915\u094D\u0936\u0928 \u0915\u0947 \u092C\u093E\u0930\u0947 \u092E\u0947\u0902
aboutUs_paragraph1 = \u0938\u092E\u092F \u0915\u0932\u0947\u0915\u094D\u0936\u0928 \u092E\u0947\u0902 \u0906\u092A\u0915\u093E \u0938\u094D\u0935\u093E\u0917\u0924 \u0939\u0948 \u2013 \u091C\u0939\u093E\u0901 \u092F\u093E\u0926\u094B\u0902 \u0915\u094B \u092A\u0930\u0902\u092A\u0930\u093E\u0913\u0902 \u092E\u0947\u0902 \u092A\u093F\u0930\u094B\u092F\u093E \u091C\u093E\u0924\u093E \u0939\u0948\u0964 \u0938\u092E\u092F \u0915\u0932\u0947\u0915\u094D\u0936\u0928 \u092E\u0947\u0902, \u0939\u092E\u093E\u0930\u093E \u092E\u093E\u0928\u0928\u093E \u200B\u200B\u0939\u0948 \u0915\u093F \u0915\u092A\u0921\u093C\u0947 \u0938\u093F\u0930\u094D\u092B\u093C \u090F\u0915 \u092B\u093C\u0948\u092C\u094D\u0930\u093F\u0915 \u0928\u0939\u0940\u0902 \u0939\u094B\u0924\u0947; \u0935\u0947 \u0938\u0902\u0938\u094D\u0915\u0943\u0924\u093F, \u0909\u0924\u094D\u0938\u0935 \u0914\u0930 \u0906\u092A\u0915\u0940 \u0905\u092A\u0928\u0940 \u0905\u0932\u0917 \u092A\u0939\u091A\u093E\u0928 \u0915\u094B \u091C\u093C\u093E\u0939\u093F\u0930 \u0915\u0930\u0928\u0947 \u0915\u093E \u091C\u093C\u0930\u093F\u092F\u093E \u0939\u094B\u0924\u0947 \u0939\u0948\u0902\u0964 2015 \u092E\u0947\u0902 \u0936\u0941\u0930\u0942 \u0939\u0941\u090F \u0939\u092E\u093E\u0930\u0947 \u0938\u092B\u093C\u0930 \u0915\u093E \u092E\u0915\u093C\u0938\u0926 \u090F\u0915 \u0939\u0940 \u0925\u093E: \u092C\u0947\u0939\u0924\u0930\u0940\u0928 \u092D\u093E\u0930\u0924\u0940\u092F \u091F\u0947\u0915\u094D\u0938\u091F\u093E\u0907\u0932 \u0915\u093E\u0930\u0940\u0917\u0930\u0940 \u0914\u0930 \u092E\u0949\u0921\u0930\u094D\u0928 \u0938\u094D\u091F\u093E\u0907\u0932 \u0915\u094B \u090F\u0915 \u0939\u0940 \u091C\u0917\u0939 \u092A\u0930 \u0932\u093E\u0928\u093E\u0964
aboutUs_paragraph2 = \u0907\u0902\u0926\u094C\u0930 \u0915\u0947 \u092C\u0940\u091A\u094B\u0902-\u092C\u0940\u091A \u0938\u094D\u0925\u093F\u0924, \u0939\u092E \u092A\u0930\u093F\u0935\u093E\u0930\u094B\u0902 \u0915\u0947 \u0932\u093F\u090F \u091C\u093C\u093F\u0902\u0926\u0917\u0940 \u0915\u0947 \u0938\u092C\u0938\u0947 \u0916\u093E\u0938 \u092E\u094C\u0915\u094B\u0902 \u0915\u093E \u091C\u0936\u094D\u0928 \u092E\u0928\u093E\u0928\u0947 \u0915\u0940 \u090F\u0915 \u092D\u0930\u094B\u0938\u0947\u092E\u0902\u0926 \u091C\u0917\u0939 \u092C\u0928 \u0917\u090F \u0939\u0948\u0902\u0964 \u0939\u092E \u090F\u0925\u0928\u093F\u0915 \u0935\u093F\u092F\u0930 \u0915\u0940 \u090F\u0915 \u0936\u093E\u0928\u0926\u093E\u0930 \u0930\u0947\u0902\u091C \u0924\u0948\u092F\u093E\u0930 \u0915\u0930\u0928\u0947 \u092E\u0947\u0902 \u092E\u093E\u0939\u093F\u0930 \u0939\u0948\u0902, \u091C\u093F\u0938\u092E\u0947\u0902 \u092C\u093E\u0930\u0940\u0915\u0940 \u0938\u0947 \u0921\u093F\u091C\u093C\u093E\u0907\u0928 \u0915\u0940 \u0917\u0908 \u0938\u093E\u0921\u093C\u093F\u092F\u093E\u0901, \u0936\u093E\u0928\u0926\u093E\u0930 \u0932\u0939\u0902\u0917\u0947, \u092A\u094D\u0930\u0940\u092E\u093F\u092F\u092E \u0921\u094D\u0930\u0947\u0938 \u092E\u091F\u0940\u0930\u093F\u092F\u0932 \u0914\u0930 \u092E\u0949\u0921\u0930\u094D\u0928 \u0915\u0941\u0930\u094D\u0924\u093F\u092F\u093E\u0901 \u0936\u093E\u092E\u093F\u0932 \u0939\u0948\u0902; \u0938\u093E\u0925 \u0939\u0940, \u092A\u0941\u0930\u0941\u0937\u094B\u0902 \u0914\u0930 \u092C\u091A\u094D\u091A\u094B\u0902 \u0915\u0947 \u0915\u092A\u0921\u093C\u094B\u0902 \u0915\u093E \u092D\u0940 \u0916\u093E\u0938 \u0915\u0932\u0947\u0915\u094D\u0936\u0928 \u0909\u092A\u0932\u092C\u094D\u0927 \u0939\u0948\u0964

