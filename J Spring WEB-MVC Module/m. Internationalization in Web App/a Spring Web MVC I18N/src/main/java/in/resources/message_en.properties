aboutUs_paragraph1 = Welcome to Samay Collection \u2013 Stitching Memories into TraditionsAt Samay Collection, we believe that clothing is more than just fabric; it is an expression of culture, celebration, and individuality. Established in 2015, our journey began with a simple mission: to bring the finest Indian textile craftsmanship and modern styles together under one roof.
aboutUs_paragraph2 = Located in the heart of Indore, we have grown to become a trusted destination for families celebrating life's most precious milestones. We specialize in curating an extraordinary  range of ethnic wear, including intricately designed Sarees, elegant Lehangas, premium Dress Materials, and contemporary Kurtis, alongside a handpicked selection of menswear and kids' apparel.

